# Managed by Codebase Analysis AI.
name: Codebase Analysis AI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["__DEFAULT_BRANCH__"]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codebase-analysis-ai:
    name: Documentation consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run documentation audit
        run: |
          report="$RUNNER_TEMP/codebase-analysis-ai-report.json"
          python3 tools/codebase-analysis-ai/check.py check \
            --mode ci \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH" \
            --warn-only \
            --json > "$report" || true
          python3 - "$report" <<'PY'
          import json
          import sys

          keys = (
              "errors",
              "mapErrors",
              "linkErrors",
              "staleMappings",
              "unmappedFiles",
              "missingDocuments",
              "unregisteredDocuments",
              "indexErrors",
              "removedMappings",
              "sectionErrors",
              "adrErrors",
              "coverageErrors",
              "navigationErrors",
              "planvaultErrors",
          )
          try:
              with open(sys.argv[1], encoding="utf-8") as stream:
                  report = json.load(stream)
          except (OSError, ValueError) as exc:
              print(f"::warning title=Documentation audit::Audit report could not be read: {exc}")
              raise SystemExit(0)
          if not isinstance(report, dict):
              print("::warning title=Documentation audit::Audit report is not a JSON object.")
              raise SystemExit(0)
          problems = [key for key in keys if report.get(key)]
          if problems:
              print(
                  "::warning title=Documentation audit::Documentation inconsistencies were reported in: "
                  + ", ".join(problems)
                  + ". This audit is warning-only and does not block the workflow."
              )
          PY
